<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="50%" stop-color="#0b0d13" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Card Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.06)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="898" height="238" rx="14" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />
  <rect x="1" y="1" width="898" height="238" rx="14" fill="url(#ambientGlow)" />

  <!-- Top Status Bar -->
  <g transform="translate(42, 38)">
    <circle cx="5" cy="5" r="4" fill="#10b981" filter="url(#subtleGlow)" />
    <circle cx="5" cy="5" r="2.5" fill="#34d399" />
    <text x="18" y="9" class="mono" font-size="11" font-weight="600" fill="#6ee7b7" letter-spacing="1.5">SYSTEMS OPERATIONAL</text>
    <text x="210" y="9" class="mono" font-size="11" fill="rgba(255, 255, 255, 0.3)">//</text>
    <text x="230" y="9" class="mono" font-size="11" fill="#94a3b8" letter-spacing="1">ARCH LINUX · HYPRLAND</text>
    <text x="435" y="9" class="mono" font-size="11" fill="rgba(255, 255, 255, 0.3)">//</text>
    <text x="455" y="9" class="mono" font-size="11" fill="#94a3b8" letter-spacing="1">SUB-MILLISECOND PRECISION</text>
  </g>

  <!-- Main Hero Heading -->
  <g transform="translate(42, 106)">
    <text x="0" y="0" class="sans" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">AIMY</text>
    <text x="145" y="-10" class="mono" font-size="12" font-weight="700" fill="url(#accentGrad)" letter-spacing="2">CRAFTSMAN</text>
    <text x="0" y="28" class="sans" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      High-precision systems software &amp; minimalist desktop instruments.
    </text>
  </g>

  <!-- Technical Spec Metric Badges (Linear/Raycast style) -->
  <g transform="translate(42, 172)">
    <!-- Pill 1: Rust -->
    <rect x="0" y="0" width="138" height="34" rx="7" fill="url(#pillGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="18" cy="17" r="3" fill="#f97316" />
    <text x="30" y="22" class="mono" font-size="11" font-weight="600" fill="#f1f5f9">RUST 2024</text>

    <!-- Pill 2: Flutter -->
    <rect x="150" y="0" width="168" height="34" rx="7" fill="url(#pillGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="168" cy="17" r="3" fill="#38bdf8" />
    <text x="180" y="22" class="mono" font-size="11" font-weight="600" fill="#f1f5f9">FLUTTER DESKTOP</text>

    <!-- Pill 3: Cold Boot -->
    <rect x="330" y="0" width="148" height="34" rx="7" fill="url(#pillGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="348" cy="17" r="3" fill="#a855f7" />
    <text x="360" y="22" class="mono" font-size="11" font-weight="600" fill="#f1f5f9">&lt;10MS COLD BOOT</text>

    <!-- Pill 4: RAM -->
    <rect x="490" y="0" width="138" height="34" rx="7" fill="url(#pillGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="508" cy="17" r="3" fill="#10b981" />
    <text x="520" y="22" class="mono" font-size="11" font-weight="600" fill="#f1f5f9">~5MB RESIDENT</text>

    <!-- Pill 5: TUN -->
    <rect x="640" y="0" width="176" height="34" rx="7" fill="url(#pillGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="658" cy="17" r="3" fill="#ec4899" />
    <text x="670" y="22" class="mono" font-size="11" font-weight="600" fill="#f1f5f9">KERNEL TUN ROUTE</text>
  </g>
</svg>
